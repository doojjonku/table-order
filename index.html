<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR 식탁 주문 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 실제 QR 주문(토스 오더 계열) 화면 흐름: 흰 바탕, 가게 이름 → 붙어 다니는 분류 탭 → 한 줄 메뉴(사진 오른쪽) → 아래 파란 장바구니 버튼.
   실제 앱처럼 늘 흰 화면 하나로 만든다(어두운 모드 없음). */
:root {
  color-scheme: light;
  --white: #FFFFFF;
  --g50: #F9FAFB; --g100: #F2F4F6; --g200: #E5E8EB; --g300: #D1D6DB; --g400: #B0B8C1;
  --g500: #8B95A1; --g600: #6B7684; --g700: #4E5968; --g800: #333D4B; --g900: #191F28;
  --blue: #3182F6; --blue-d: #1B64DA; --blue-soft: #E8F3FF;
  --red: #F04452; --red-soft: #FFEEEE;
  --dim: rgba(0, 23, 51, .45);
  --font: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
html, body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--white); }
body { color: var(--g900); font-family: var(--font); font-size: 18px; line-height: 1.45; letter-spacing: -0.02em; }
button { font: inherit; color: inherit; letter-spacing: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.gut { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.page { max-width: 560px; margin: 0 auto; }

/* 맨 위 */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--white); }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--white); }
.appbar .in { display: flex; align-items: center; gap: 8px; height: 56px; }
.appbar .ttl { flex: 1; min-width: 0; font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-btn { height: 40px; padding: 0 14px; border-radius: 10px; background: var(--g100); color: var(--g800); font-weight: 600; font-size: 16px; white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; margin-left: -10px; }
.icon-btn svg { width: 26px; height: 26px; }

.store { padding-block: 6px 18px; }
.store h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }
.store .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--g600); font-size: 16px; }
.tbl { background: var(--blue-soft); color: var(--blue-d); font-weight: 700; border-radius: 8px; padding: 2px 10px; }
.notice { margin-top: 14px; background: var(--g100); border-radius: 14px; padding: 12px 14px; font-size: 15px; color: var(--g700); display: flex; gap: 8px; }
.notice b { color: var(--red); }

/* 분류 탭 */
.tabs { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--white); border-bottom: 1px solid var(--g200); }
.tabs .in { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; }
.tabs .in::-webkit-scrollbar { display: none; }
.tab { flex: none; height: 50px; font-size: 18px; font-weight: 600; color: var(--g500); border-bottom: 3px solid transparent; }
.tab[aria-selected="true"] { color: var(--g900); font-weight: 800; border-bottom-color: var(--g900); }

/* 메뉴 */
.sec { padding-top: 26px; scroll-margin-top: calc(110px + env(safe-area-inset-top, 0px)); }
.sec h2 { margin: 0 0 4px; font-size: 21px; font-weight: 800; }
.row { display: flex; gap: 16px; align-items: center; width: 100%; text-align: left; padding-block: 16px; border-bottom: 1px solid var(--g100); }
.sec .row:last-child { border-bottom: 0; }
.row .t { flex: 1; min-width: 0; display: grid; gap: 3px; }
.row .nm { font-size: 19px; font-weight: 700; color: var(--g900); }
.row .ds { font-size: 15px; color: var(--g600); }
.row .pr { font-size: 18px; font-weight: 700; color: var(--g900); margin-top: 2px; }
.ph { flex: none; width: 104px; height: 104px; border-radius: 16px; background: var(--g100); display: grid; place-items: center; font-size: 56px; position: relative; overflow: hidden; }
.ph.lg { width: 100%; height: 260px; border-radius: 0; font-size: 130px; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph.lg { height: auto; aspect-ratio: 1 / 0.8; }
.ph .incart { z-index: 1; }
.tag { display: inline-block; font-size: 13px; font-weight: 700; color: var(--red); background: var(--red-soft); border-radius: 6px; padding: 1px 7px; margin-right: 6px; vertical-align: 2px; }
.incart { position: absolute; right: 6px; bottom: 6px; background: var(--blue); color: #fff; font-size: 13px; font-weight: 700; border-radius: 99px; padding: 1px 8px; }
.spacer { height: 130px; }

/* 아래 파란 버튼 */
.cta-wrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: linear-gradient(to top, var(--white) 70%, rgba(255,255,255,0));
  padding-top: 18px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.cta-wrap .page { display: flex; gap: 10px; }
.cta { flex: 1; height: 60px; border-radius: 16px; background: var(--blue); color: #fff; font-size: 19px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .1s; }
.cta:active { background: var(--blue-d); transform: scale(.98); }
.cta:disabled { background: var(--g200); color: var(--g500); }
.cta.sub { flex: 0 0 36%; background: var(--blue-soft); color: var(--blue-d); }
.cta .cnt { background: #fff; color: var(--blue); border-radius: 99px; min-width: 26px; height: 26px; padding: 0 7px; display: grid; place-items: center; font-size: 15px; }
.cta .sp { flex: 1; }
.cta.split { justify-content: space-between; padding: 0 20px; }

/* 메뉴 상세 (전체 화면) */
.full { position: fixed; inset: 0; z-index: 20; background: var(--white); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); }
.full .appbar { position: sticky; }
.detail-head { padding-block: 20px 22px; border-bottom: 12px solid var(--g100); }
.detail-head h1 { margin: 0; font-size: 26px; font-weight: 800; }
.detail-head p { margin: 6px 0 0; color: var(--g600); font-size: 16px; }
.detail-head .pr { margin-top: 12px; font-size: 22px; font-weight: 800; }
.grp { padding-block: 22px 8px; border-bottom: 12px solid var(--g100); }
.grp-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.grp-h b { font-size: 19px; }
.pill { font-size: 14px; font-weight: 700; border-radius: 99px; padding: 2px 10px; }
.pill.need { background: var(--blue-soft); color: var(--blue-d); }
.pill.need.miss { background: var(--red-soft); color: var(--red); }
.pill.free { background: var(--g100); color: var(--g600); }
.choice { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 58px; text-align: left; font-size: 18px; }
.choice .lb { flex: 1; }
.choice .plus { color: var(--g600); }
.mark { flex: none; width: 26px; height: 26px; border: 2px solid var(--g300); display: grid; place-items: center; }
.mark.radio { border-radius: 50%; }
.mark.box { border-radius: 7px; }
.choice[aria-checked="true"] .mark { border-color: var(--blue); background: var(--blue); }
.choice[aria-checked="true"] .mark.radio { background: var(--white); border-width: 8px; }
.choice[aria-checked="true"] .mark.box::after { content: ""; width: 7px; height: 12px; border: solid #fff; border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg); }
.qty-row { display: flex; justify-content: space-between; align-items: center; padding-block: 20px; }
.qty-row b { font-size: 19px; }
.stepper { display: flex; align-items: center; border: 1px solid var(--g200); border-radius: 12px; overflow: hidden; }
.stepper button { width: 50px; height: 48px; font-size: 26px; color: var(--g700); display: grid; place-items: center; }
.stepper button:disabled { color: var(--g300); }
.stepper span { min-width: 40px; text-align: center; font-weight: 700; font-size: 19px; }
.stepper.sm button { width: 44px; height: 42px; font-size: 22px; }

/* 장바구니 */
.cart-item { padding-block: 20px; border-bottom: 1px solid var(--g100); display: grid; gap: 12px; }
.ci-top { display: flex; gap: 14px; }
.ci-top .ph { width: 72px; height: 72px; font-size: 40px; border-radius: 12px; }
.ci-top .t { flex: 1; min-width: 0; display: grid; gap: 2px; align-content: start; }
.ci-top .nm { font-weight: 700; font-size: 19px; }
.ci-top .op { font-size: 15px; color: var(--g600); }
.x { width: 36px; height: 36px; display: grid; place-items: center; color: var(--g400); margin: -6px -8px 0 0; }
.ci-bot { display: flex; justify-content: space-between; align-items: center; }
.ci-bot .pr { font-weight: 800; font-size: 19px; }
.add-more { display: flex; justify-content: center; align-items: center; gap: 6px; width: 100%; height: 54px; margin-top: 14px; border-radius: 14px; background: var(--g100); color: var(--g700); font-weight: 600; }
.sum-box { margin-top: 26px; background: var(--g50); border-radius: 16px; padding: 18px; display: grid; gap: 8px; }
.sum-box div { display: flex; justify-content: space-between; color: var(--g700); font-size: 16px; }
.sum-box .tot { color: var(--g900); font-size: 21px; font-weight: 800; padding-top: 8px; border-top: 1px solid var(--g200); }
.pay-note { margin-top: 12px; color: var(--g600); font-size: 15px; text-align: center; }
.empty { padding-block: 80px; text-align: center; color: var(--g500); }

/* 아래에서 올라오는 창 */
.dim { position: fixed; inset: 0; z-index: 30; background: var(--dim); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet { width: 100%; max-width: 560px; background: var(--white); border-radius: 24px 24px 0 0; animation: up .25s cubic-bezier(.2,.8,.2,1);
  padding: 28px max(22px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); }
.sheet h2 { margin: 0; font-size: 23px; font-weight: 800; }
.sheet p { margin: 8px 0 0; color: var(--g600); font-size: 16px; }
.sheet .btns { display: flex; gap: 10px; margin-top: 24px; }
.sheet .btns .cta.sub { flex: 1; background: var(--g100); color: var(--g700); }
.lines { margin-top: 16px; display: grid; gap: 8px; font-size: 17px; }
.lines div { display: flex; justify-content: space-between; gap: 12px; }
.lines .op { color: var(--g500); font-size: 14px; }
.call-grid { margin-top: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.call { height: 92px; border-radius: 16px; background: var(--g50); border: 2px solid var(--g100); display: grid; place-items: center; align-content: center; gap: 4px; font-size: 16px; font-weight: 600; color: var(--g800); }
.call i { font-style: normal; font-size: 30px; }
.call[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-d); }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }

/* 주문 완료 */
.done { padding-block: 48px 160px; }
.done .ok { width: 72px; height: 72px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; }
.done .ok svg { width: 38px; height: 38px; }
.done h1 { margin: 22px 0 0; font-size: 28px; font-weight: 800; line-height: 1.35; }
.done .sub { margin-top: 8px; color: var(--g600); font-size: 17px; }
.bill { margin-top: 30px; border-top: 1px solid var(--g200); padding-top: 18px; display: grid; gap: 14px; }
.bill h3 { margin: 0; font-size: 18px; color: var(--g700); }
.bill .ln { display: flex; justify-content: space-between; gap: 12px; }
.bill .ln .op { display: block; font-size: 14px; color: var(--g500); }
.bill .tot { border-top: 1px solid var(--g200); padding-top: 14px; font-weight: 800; font-size: 21px; }
.round { font-size: 14px; font-weight: 700; color: var(--blue-d); background: var(--blue-soft); border-radius: 6px; padding: 1px 7px; margin-left: 6px; }

/* 왼쪽 분류 + 오른쪽 메뉴 */
.appbar.main { border-bottom: 1px solid var(--g200); }
.appbar .ttl b { font-weight: 800; font-size: 19px; margin-right: 8px; }
.appbar .ttl .tbl { font-size: 15px; vertical-align: 1px; }
.cart-btn { position: relative; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 12px; color: var(--g900); margin-right: -6px; }
.cart-btn svg { width: 30px; height: 30px; }
.cart-btn .badge { position: absolute; top: 2px; right: 0; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 99px; background: var(--red);
  color: #fff; font-size: 14px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--white); }
.cart-btn .badge.bump { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.45); } }
.shell { display: grid; grid-template-columns: 100px minmax(0, 1fr); }
.side { position: sticky; top: calc(57px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - 57px - env(safe-area-inset-top, 0px));
  overflow-y: auto; background: var(--g100); padding-left: env(safe-area-inset-left, 0px); padding-bottom: 20px; }
.side button { display: block; width: 100%; min-height: 66px; padding: 10px 8px; font-size: 17px; font-weight: 600; color: var(--g600); text-align: center; line-height: 1.3; }
.side button[aria-selected="true"] { background: var(--white); color: var(--g900); font-weight: 800; box-shadow: inset 4px 0 0 var(--blue); }
.side .hist { color: var(--blue-d); border-top: 1px solid var(--g200); }
.list { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 60px 16px; }
.list .notice { margin: 0 0 16px; }
.cat-h { margin: 0 0 14px; font-size: 23px; font-weight: 800; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px 12px; }
.card { display: grid; gap: 4px; text-align: left; align-content: start; min-width: 0; }
.card .ph { width: 100%; height: auto; aspect-ratio: 1; max-width: 100%; font-size: 64px; margin-bottom: 6px; }
.card .nm { font-size: 18px; font-weight: 700; }
.card .pr { font-size: 18px; font-weight: 800; }
.card .ds { font-size: 14px; color: var(--g600); }
.side { display: flex; flex-direction: column; padding-bottom: 0; }
.side-foot { margin-top: auto; border-top: 1px solid var(--g200); padding-bottom: env(safe-area-inset-bottom, 0px); }
.side .hist { border-top: 0; }
.side .callbtn { min-height: 76px; color: var(--g800); font-weight: 700; background: var(--g200); }
.msec + .msec { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--g200); }

/* 휴대폰 화면 폭: 컴퓨터에서 열어도 휴대폰 크기로 가운데에 보이게 */
#app { max-width: 430px; margin: 0 auto; background: var(--white); min-height: 100vh; }
@media (min-width: 520px) {
  html, body { background: var(--g200); }
  #app { box-shadow: 0 0 0 1px var(--g300); }
  .appbar, .full .appbar { background: var(--white); }
}
.page { max-width: 430px; }
.full, .dim { left: max(0px, calc(50% - 215px)); right: max(0px, calc(50% - 215px)); }
.cta-wrap { left: max(0px, calc(50% - 215px)); right: max(0px, calc(50% - 215px)); }
.sheet { max-width: 430px; }
body::before { left: max(0px, calc(50% - 215px)); right: max(0px, calc(50% - 215px)); }
.shell { grid-template-columns: 88px minmax(0, 1fr); }
.side button { font-size: 16px; padding: 10px 6px; }
.cards { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.toast { position: fixed; left: 50%; bottom: calc(36px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40;
  background: rgba(25, 31, 40, .92); color: #fff; border-radius: 14px; padding: 13px 20px; font-size: 16px; font-weight: 600;
  width: max-content; max-width: calc(100% - 40px); text-align: center; animation: fade .2s; }
@media (prefers-reduced-motion: reduce) { .dim, .sheet, .toast { animation: none; } .cta { transition: none; } }
</style>
</head>
<body>

<div id="app"></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
const SHOP = "온기 한식당";
const hm = /^#t(\d{1,2})$/.exec(location.hash);
const TABLE = hm ? Number(hm[1]) : 3;

const SPICY = { name: "맵기", need: true, one: true, items: [{ n: "순한 맛" }, { n: "보통 맛" }, { n: "매운 맛" }] };
const CUT = { name: "면 자르기", need: true, one: true, items: [{ n: "가위로 잘라 주세요" }, { n: "자르지 않아요" }] };
const BIG = { name: "추가", need: false, one: false, items: [{ n: "곱빼기", p: 2000 }] };
const CATS = [
  { name: "추천", items: [

      opts: [SPICY, { name: "추가", need: false, one: false, items: [{ n: "라면 사리", p: 2000 }, { n: "공기밥 하나 더", p: 1000 }] }] },

    { id: "galbi", nm: "갈비탕", p: 13000, e: "🍖", d: "푹 고은 소갈비, 공기밥 포함", hot: true },
    { id: "bossam", nm: "보쌈 정식", p: 14000, e: "🥬", d: "수육과 보쌈김치, 된장국", hot: true }
  ]},
  { name: "식사", items: [
    { id: "doen", nm: "된장찌개", p: 9000, e: "🥘", d: "구수한 집 된장, 공기밥 포함" },
    { id: "jeyuk", nm: "제육볶음", p: 11000, e: "🍖", d: "상추쌈과 공기밥 포함", opts: [SPICY] },
    { id: "bibim", nm: "산채 비빔밥", p: 10000, e: "🍚", d: "나물 다섯 가지와 고추장" },
    { id: "sundubu", nm: "순두부찌개", p: 9000, e: "🍲", d: "해물 순두부, 날계란 하나", opts: [SPICY] },
    { id: "yukgae", nm: "육개장", p: 10000, e: "🌶️", d: "얼큰한 소고기 육개장" },
    { id: "bulgogi", nm: "뚝배기 불고기", p: 11000, e: "🥘", d: "달달한 국물 불고기" },
    { id: "godeung", nm: "고등어구이 정식", p: 11000, e: "🐟", d: "노릇하게 구운 고등어 한 마리" },
    { id: "ojing", nm: "오징어 덮밥", p: 10000, e: "🦑", d: "매콤한 오징어볶음 덮밥", opts: [SPICY] }
  ]},
  { name: "면", items: [
    { id: "mul", nm: "물냉면", p: 10000, e: "🍜", d: "동치미 국물", opts: [CUT, BIG] },
    { id: "bnaeng", nm: "비빔냉면", p: 10000, e: "🍝", d: "새콤달콤 양념", opts: [CUT, BIG] },
    { id: "janchi", nm: "잔치국수", p: 7000, e: "🍜", d: "멸치 국물에 소면", opts: [BIG] },
    { id: "kong", nm: "콩국수", p: 10000, e: "🥛", d: "고소한 검은콩 국물", opts: [{ name: "간 맞추기", need: true, one: true, items: [{ n: "소금" }, { n: "설탕" }] }] },
    { id: "yeolmu", nm: "열무국수", p: 8000, e: "🥗", d: "시원한 열무김치 국수", opts: [BIG] },
    { id: "mandu", nm: "만둣국", p: 9000, e: "🥟", d: "손만두 다섯 개" }
  ]},
  { name: "곁들임", items: [
    { id: "egg", nm: "계란말이", p: 7000, e: "🍳", d: "두툼하게 말았어요" },
    { id: "pajeon", nm: "해물파전", p: 15000, e: "🥞", d: "둘이 나눠 먹기 좋아요" },
    { id: "kimjeon", nm: "김치전", p: 12000, e: "🥞", d: "바삭하게 부친 김치전" },
    { id: "dubu", nm: "두부김치", p: 14000, e: "🧈", d: "따뜻한 두부와 볶음김치" },
    { id: "suyuk", nm: "수육 (작은 것)", p: 20000, e: "🥩", d: "삶은 돼지고기, 새우젓" },
    { id: "gunmandu", nm: "군만두", p: 6000, e: "🥟", d: "여섯 개" },
    { id: "rice", nm: "공기밥", p: 1000, e: "🍚", d: "한 그릇" }
  ]},
  { name: "주류", items: [
    { id: "soju", nm: "소주", p: 5000, e: "🍶", d: "한 병", opts: [{ name: "종류", need: true, one: true, items: [{ n: "참이슬" }, { n: "처음처럼" }] }] },
    { id: "beer", nm: "맥주", p: 5000, e: "🍺", d: "한 병", opts: [{ name: "종류", need: true, one: true, items: [{ n: "카스" }, { n: "테라" }] }] },
    { id: "makgeolli", nm: "막걸리", p: 5000, e: "🍶", d: "장수 막걸리 한 병" }
  ]},
  { name: "음료", items: [
    { id: "cola", nm: "콜라", p: 2000, e: "🥤", d: "캔 355ml" },
    { id: "cider", nm: "사이다", p: 2000, e: "🥤", d: "캔 355ml" },
    { id: "sikhye", nm: "식혜", p: 3000, e: "🍵", d: "가게에서 직접 만든 식혜" },
    { id: "zero", nm: "제로 콜라", p: 2000, e: "🥤", d: "설탕 없는 콜라, 캔" },
    { id: "juice", nm: "오렌지 주스", p: 3000, e: "🧃", d: "한 병" },
    { id: "water", nm: "생수", p: 1000, e: "💧", d: "500ml 한 병" }
  ]}
];
const CALLS = [["💧", "물"], ["🍽️", "앞접시"], ["🥢", "수저"], ["🧻", "물티슈"], ["🧂", "반찬 더"], ["🙋", "직원만"]];

const S = { view: "menu", tab: 0, cart: [], orders: [], full: null, sheet: null };
const won = n => n.toLocaleString("ko-KR") + "원";
const find = id => CATS.flatMap(c => c.items).find(x => x.id === id);
const count = () => S.cart.reduce((a, c) => a + c.q, 0);
const unit = c => c.p + c.add.reduce((a, o) => a + (o.p || 0), 0);
const sum = list => list.reduce((a, c) => a + unit(c) * c.q, 0);
const optText = c => c.add.map(o => o.n).join(", ");
const inCart = id => S.cart.filter(c => c.id === id).reduce((a, c) => a + c.q, 0);

const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  x: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

const app = document.getElementById("app"), layer = document.getElementById("layer");

const CART_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.1 10.4a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>';
function bar(title, back) {
  const n = count();
  return `<header class="appbar main"><div class="gut in">
    ${back ? `<button class="icon-btn" data-act="${back}" aria-label="뒤로">${ICON.back}</button>` : ""}
    <div class="ttl">${title}</div>
    ${S.view !== "cart" ? `<button class="cart-btn" data-act="cart" aria-label="장바구니 ${n}개">${CART_SVG}${n ? `<span class="badge num ${S.bump ? "bump" : ""}">${n}</span>` : ""}</button>` : ""}
  </div></header>`;
}

function render() {
  const head = `<b>${SHOP}</b><span class="tbl">${TABLE}번 테이블</span>`;
  const keepY = window.scrollY;
  if (S.view === "menu") {
    app.innerHTML = bar(head) + `<div class="shell">
      <nav class="side" role="tablist" aria-label="메뉴 분류">
        ${CATS.map((k, i) => `<button role="tab" aria-selected="${i === S.tab}" data-act="tab" data-v="${i}">${k.name}</button>`).join("")}
        <div class="side-foot">
          ${S.orders.length ? `<button class="hist" data-act="history">📋<br>주문내역</button>` : ""}
          <button class="callbtn" data-act="call">🔔<br>직원 호출</button>
        </div>
      </nav>
      <main class="list">
        ${S.orders.length ? "" : `<div class="notice"><b>연습</b><span>연습 화면이에요. 진짜 주문은 들어가지 않아요.</span></div>`}
        ${CATS.map((c, i) => `<section class="msec" id="sec${i}" data-i="${i}">
        <h2 class="cat-h">${c.name}</h2>
        <div class="cards">${c.items.map(x => { const k = inCart(x.id); return `
          <button class="card" data-act="open" data-v="${x.id}">
            <span class="ph" aria-hidden="true"><img src="qr_food/${x.id}.jpg" alt="" loading="lazy">${k ? `<span class="incart num">${k}개 담음</span>` : ""}</span>
            <span class="nm">${x.hot ? '<span class="tag">인기</span>' : ""}${x.nm}</span>
            <span class="pr num">${won(x.p)}</span>
            <span class="ds">${x.d}</span>
          </button>`; }).join("")}
        </div></section>`).join("")}
        <div style="height:55vh"></div>
      </main>
    </div>`;
    window.scrollTo(0, keepY);
    watchTabs();
  }
  if (S.view === "cart") {
    app.innerHTML = bar("장바구니", "menu") + `<main class="page gut">
      ${S.cart.length ? S.cart.map((c, i) => `
        <div class="cart-item">
          <div class="ci-top"><span class="ph" aria-hidden="true"><img src="qr_food/${c.id}.jpg" alt=""></span>
            <div class="t"><span class="nm">${c.nm}</span>${c.add.length ? `<span class="op">${optText(c)}</span>` : ""}<span class="op num">${won(unit(c))}</span></div>
            <button class="x" data-act="del" data-v="${i}" aria-label="${c.nm} 빼기">${ICON.x}</button></div>
          <div class="ci-bot"><span class="pr num">${won(unit(c) * c.q)}</span>
            <div class="stepper sm"><button data-act="minus" data-v="${i}" aria-label="하나 빼기" ${c.q < 2 ? "disabled" : ""}>−</button><span class="num">${c.q}</span><button data-act="plus" data-v="${i}" aria-label="하나 더하기">+</button></div></div>
        </div>`).join("") + `
        <button class="add-more" data-act="menu">+ 메뉴 더 담기</button>
        <div class="sum-box"><div><span>주문 금액</span><span class="num">${won(sum(S.cart))}</span></div>
          <div class="tot"><span>총 금액</span><span class="num">${won(sum(S.cart))}</span></div></div>
        <p class="pay-note">계산은 다 드시고 나갈 때 카운터에서 해요</p>`
      : `<p class="empty">장바구니가 비어 있어요</p><button class="add-more" data-act="menu">+ 메뉴 담으러 가기</button>`}
      <div class="spacer"></div>
    </main>
    ${S.cart.length ? `<div class="cta-wrap"><div class="page gut"><button class="cta" data-act="ask"><span class="num">${won(sum(S.cart))}</span> 주문하기</button></div></div>` : ""}`;
  }
  if (S.view === "done") {
    const last = S.orders.length;
    app.innerHTML = bar(head) + `<main class="page gut done">
      <div class="ok">${ICON.ok}</div>
      <h1>주문을 받았어요</h1>
      <div class="sub">음식이 나올 때까지 자리에서 기다려 주세요.</div>
      ${billHtml()}
    </main>
    <div class="cta-wrap"><div class="page gut">
      <button class="cta sub" data-act="reset">처음부터</button>
      <button class="cta" data-act="menu">메뉴 더 보기</button>
    </div></div>`;
  }
  renderLayer();
  S.bump = false;
}

function billHtml() {
  const all = S.orders.flatMap((o, r) => o.map(c => ({ ...c, r: r + 1 })));
  return `<div class="bill"><h3>${TABLE}번 테이블 주문내역</h3>
    ${all.map(c => `<div class="ln"><span>${c.nm} ${c.q}개${S.orders.length > 1 ? `<span class="round">${c.r}차</span>` : ""}${c.add.length ? `<span class="op">${optText(c)}</span>` : ""}</span><span class="num">${won(unit(c) * c.q)}</span></div>`).join("")}
    <div class="ln tot"><span>총 금액</span><span class="num">${won(sum(all))}</span></div></div>`;
}

function renderLayer() {
  let h = "";
  const f = S.full;
  if (f) {
    const x = find(f.id);
    const missing = (x.opts || []).some((g, gi) => g.need && !f.pick[gi].length);
    const price = (x.p + (x.opts || []).reduce((a, g, gi) => a + f.pick[gi].reduce((b, ii) => b + (g.items[ii].p || 0), 0), 0)) * f.q;
    h += `<div class="full" role="dialog" aria-label="${x.nm}">
      <header class="appbar"><div class="page gut in"><button class="icon-btn" data-act="close" aria-label="뒤로">${ICON.back}</button><div class="ttl"></div></div></header>
      <div class="ph lg" aria-hidden="true"><img src="qr_food/${x.id}.jpg" alt=""></div>
      <div class="page">
        <div class="gut detail-head"><h1>${x.nm}</h1><p>${x.d}</p><div class="pr num">${won(x.p)}</div></div>
        ${(x.opts || []).map((g, gi) => `<div class="gut grp">
          <div class="grp-h"><b>${g.name}</b>${g.need ? `<span class="pill need ${f.pick[gi].length ? "" : "miss"}">꼭 골라요</span>` : `<span class="pill free">골라도 돼요</span>`}</div>
          ${g.items.map((it, ii) => `<button class="choice" role="${g.one ? "radio" : "checkbox"}" aria-checked="${f.pick[gi].includes(ii)}" data-act="pick" data-g="${gi}" data-v="${ii}">
            <span class="mark ${g.one ? "radio" : "box"}"></span><span class="lb">${it.n}</span>${it.p ? `<span class="plus num">+${won(it.p)}</span>` : ""}</button>`).join("")}
        </div>`).join("")}
        <div class="gut qty-row"><b>수량</b>
          <div class="stepper"><button data-act="q-" aria-label="하나 빼기" ${f.q < 2 ? "disabled" : ""}>−</button><span class="num">${f.q}</span><button data-act="q+" aria-label="하나 더하기">+</button></div></div>
        <div class="spacer"></div>
      </div>
      <div class="cta-wrap"><div class="page gut">
        <button class="cta" data-act="add" ${missing ? "disabled" : ""}>${missing ? "'꼭 골라요'를 먼저 골라 주세요" : `<span class="num">${won(price)}</span> 담기`}</button>
      </div></div>
    </div>`;
  }
  const s = S.sheet;
  if (s && s.type === "ask") {
    h += `<div class="dim" data-act="shut"><div class="sheet" role="dialog" aria-label="주문 확인">
      <h2>이대로 주문할까요?</h2><p>주문하면 주방으로 바로 들어가요.</p>
      <div class="lines">${S.cart.map(c => `<div><span>${c.nm} ${c.q}개${c.add.length ? `<br><span class="op">${optText(c)}</span>` : ""}</span><span class="num">${won(unit(c) * c.q)}</span></div>`).join("")}</div>
      <div class="btns"><button class="cta sub" data-act="shut-btn">아니요</button><button class="cta" data-act="order">주문하기</button></div>
    </div></div>`;
  }
  if (s && s.type === "call") {
    h += `<div class="dim" data-act="shut"><div class="sheet" role="dialog" aria-label="직원 호출">
      <h2>무엇을 가져다 드릴까요?</h2><p>필요한 것을 모두 눌러 주세요.</p>
      <div class="call-grid">${CALLS.map(([i, n]) => `<button class="call" aria-pressed="${s.picked.includes(n)}" data-act="callpick" data-v="${n}"><i aria-hidden="true">${i}</i>${n}</button>`).join("")}</div>
      <div class="btns"><button class="cta sub" data-act="shut-btn">닫기</button><button class="cta" data-act="callsend" ${s.picked.length ? "" : "disabled"}>직원 부르기</button></div>
    </div></div>`;
  }
  if (s && s.type === "history") {
    h += `<div class="dim" data-act="shut"><div class="sheet" role="dialog" aria-label="주문내역">
      <h2>주문내역</h2>${billHtml()}
      <div class="btns"><button class="cta" data-act="shut-btn">닫기</button></div>
    </div></div>`;
  }
  layer.innerHTML = h;
  document.body.style.overflow = h ? "hidden" : "";
}

// 화면을 내리면 지금 보고 있는 분류 탭에 밑줄
let tabObs;
function watchTabs() {
  if (tabObs) tabObs.disconnect();
  tabObs = new IntersectionObserver(es => {
    if (lockTabs) return;
    const vis = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (vis) setTab(Number(vis.target.dataset.i));
  }, { rootMargin: "-120px 0px -65% 0px" });
  document.querySelectorAll(".msec").forEach(s => tabObs.observe(s));
}
let lockTabs = false;
function setTab(i) {
  S.tab = i;
  document.querySelectorAll('.side [role="tab"]').forEach((t, k) => t.setAttribute("aria-selected", k === i));
}

let tt;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2400);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === "shut" && e.target !== b) return;
  switch (a) {
    case "tab": {
      setTab(Number(v)); lockTabs = true;
      const el = document.getElementById("sec" + v);
      window.scrollTo({ top: v === "0" ? 0 : el.getBoundingClientRect().top + window.scrollY - 70, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      setTimeout(() => { lockTabs = false; }, 800); return;
    }
    case "open": { const x = find(v); S.full = { id: v, q: 1, pick: (x.opts || []).map(() => []) }; break; }
    case "close": S.full = null; break;
    case "pick": {
      const x = find(S.full.id), gi = Number(b.dataset.g), ii = Number(v), g = x.opts[gi], p = S.full.pick[gi];
      if (g.one) S.full.pick[gi] = [ii]; else { const k = p.indexOf(ii); k < 0 ? p.push(ii) : p.splice(k, 1); }
      const y = document.querySelector(".full").scrollTop; renderLayer(); document.querySelector(".full").scrollTop = y; return;
    }
    case "q-": S.full.q = Math.max(1, S.full.q - 1); { const y = document.querySelector(".full").scrollTop; renderLayer(); document.querySelector(".full").scrollTop = y; } return;
    case "q+": S.full.q = Math.min(9, S.full.q + 1); { const y = document.querySelector(".full").scrollTop; renderLayer(); document.querySelector(".full").scrollTop = y; } return;
    case "add": {
      const x = find(S.full.id);
      const add = (x.opts || []).flatMap((g, gi) => S.full.pick[gi].map(ii => g.items[ii]));
      const key = x.id + "|" + add.map(o => o.n).join(",");
      const same = S.cart.find(c => c.key === key);
      if (same) same.q += S.full.q; else S.cart.push({ key, id: x.id, nm: x.nm, e: x.e, p: x.p, add, q: S.full.q });
      S.full = null; S.bump = true; toast("장바구니에 담았어요 · 오른쪽 위에서 확인해요"); break;
    }
    case "cart": S.view = "cart"; window.scrollTo(0, 0); break;
    case "menu": S.view = "menu"; S.sheet = null; break;
    case "plus": S.cart[v].q = Math.min(9, S.cart[v].q + 1); break;
    case "minus": S.cart[v].q = Math.max(1, S.cart[v].q - 1); break;
    case "del": S.cart.splice(v, 1); break;
    case "ask": S.sheet = { type: "ask" }; break;
    case "order": S.orders.push(S.cart.map(c => ({ ...c }))); S.cart = []; S.sheet = null; S.view = "done"; window.scrollTo(0, 0); break;
    case "call": S.sheet = { type: "call", picked: [] }; break;
    case "callpick": { const p = S.sheet.picked, k = p.indexOf(v); k < 0 ? p.push(v) : p.splice(k, 1); break; }
    case "callsend": toast(`직원을 불렀어요 · ${S.sheet.picked.join(", ")}`); S.sheet = null; break;
    case "history": S.sheet = { type: "history" }; break;
    case "shut": case "shut-btn": S.sheet = null; break;
    case "reset": Object.assign(S, { view: "menu", tab: 0, cart: [], orders: [], full: null, sheet: null }); window.scrollTo(0, 0); break;
  }
  render();
});

render();
</script>
